<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#EAE3D2" />
  
  <!-- Subtle pattern dots -->
  <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#141413" opacity="0.12" />
  </pattern>
  <rect width="600" height="800" fill="url(#dotGrid)" />

  <g transform="translate(60, 60)">
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="12" fill="#605B51">KINETIC STUDIES // VOL. 03</text>
    <text x="0" y="80" font-family="Georgia, serif" font-size="48" font-style="italic" fill="#141413">Motion in</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#141413">STASIS</text>

    <!-- Overlapping Graphic Geometry -->
    <g transform="translate(30, 160)">
      <polygon points="120,40 380,120 220,380 40,260" fill="#C85A32" opacity="0.85" />
      <circle cx="220" cy="240" r="130" fill="#20201D" />
      <circle cx="160" cy="180" r="80" fill="#FBF9F5" />
      <line x1="0" y1="240" x2="420" y2="240" stroke="#FBF9F5" stroke-dasharray="6,6" stroke-width="2" />
      <line x1="220" y1="50" x2="220" y2="400" stroke="#C85A32" stroke-width="2" />
    </g>

    <text x="0" y="630" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141413">EXHIBIT POSTER DESIGN</text>
    <text x="0" y="655" font-family="system-ui, sans-serif" font-size="11" fill="#6A655C">Geometry, spatial physics and typographic balance for modern cultural spaces.</text>
  </g>
</svg>