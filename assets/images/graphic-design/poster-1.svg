<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#F4EFE6" />
  
  <!-- Outer Border -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#141413" stroke-width="1.5" />
  
  <!-- Header Text -->
  <text x="45" y="60" font-family="'Courier New', monospace" font-size="11" fill="#141413">INTERNATIONAL EXHIBITION // TOKYO • BASEL • NYC</text>
  <text x="500" y="60" font-family="'Courier New', monospace" font-size="11" fill="#C85A32">2026</text>
  <line x1="25" y1="75" x2="575" y2="75" stroke="#141413" stroke-width="1.5" />
  
  <!-- Giant Typography -->
  <text x="45" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#141413" letter-spacing="-4">FORM</text>
  <text x="45" y="290" font-family="Georgia, serif" font-size="95" font-style="italic" fill="#C85A32" letter-spacing="-2">&amp; VOID</text>
  
  <!-- Geometric Artwork -->
  <g transform="translate(45, 340)">
    <circle cx="255" cy="150" r="140" fill="#181816" />
    <circle cx="200" cy="150" r="140" fill="#C85A32" opacity="0.8" style="mix-blend-mode: multiply;" />
    <rect x="180" y="30" width="150" height="240" fill="none" stroke="#F4EFE6" stroke-width="3" />
    <circle cx="255" cy="150" r="25" fill="#F4EFE6" />
  </g>
  
  <!-- Footer Grid Info -->
  <line x1="25" y1="670" x2="575" y2="670" stroke="#141413" stroke-width="1" />
  <text x="45" y="700" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#141413">CURATED VISUAL RESEARCH</text>
  <text x="45" y="720" font-family="system-ui, sans-serif" font-size="10" fill="#6A655C">A study of negative space, asymmetric tension and contemporary brutalist typesetting.</text>
  <text x="45" y="745" font-family="'Courier New', monospace" font-size="10" fill="#C85A32">SERIES REF: GD-01 // POSTER ARCHIVE</text>
</svg>