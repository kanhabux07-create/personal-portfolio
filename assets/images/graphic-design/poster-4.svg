<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#F9F6F0" />
  
  <!-- Magazine Cover Spread Mockup -->
  <g transform="translate(40, 40)">
    <rect width="520" height="720" fill="#FFFFFF" stroke="#E2DCD0" stroke-width="1" />
    
    <!-- Masthead -->
    <text x="260" y="80" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#181816" letter-spacing="4" text-anchor="middle">ATELIER</text>
    <line x1="30" y1="105" x2="490" y2="105" stroke="#181816" stroke-width="1.5" />
    <text x="35" y="125" font-family="'Courier New', monospace" font-size="10" fill="#5F5B53">QUARTERLY DESIGN JOURNAL</text>
    <text x="485" y="125" font-family="'Courier New', monospace" font-size="10" fill="#C85A32" text-anchor="end">ISSUE N° 04 • 2026</text>
    <line x1="30" y1="135" x2="490" y2="135" stroke="#181816" stroke-width="1.5" />
    
    <!-- Feature Image Area -->
    <rect x="30" y="160" width="460" height="380" fill="#22211F" />
    <circle cx="260" cy="350" r="120" fill="#C85A32" opacity="0.6" />
    <circle cx="260" cy="350" r="70" fill="#EAE3D2" />
    <path d="M 180 430 Q 260 250 340 430" stroke="#FBF9F5" stroke-width="3" fill="none" />
    
    <!-- Headlines -->
    <text x="45" y="470" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FBF9F5">The Return of</text>
    <text x="45" y="505" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FBF9F5" letter-spacing="-0.5">THE TACTILE WEB</text>
    
    <!-- Lead Stories -->
    <g transform="translate(35, 570)">
      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#181816">01 / ANALOG SENSIBILITIES IN DIGITAL SPACES</text>
      <text x="0" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#757065">How editorial print layouts are reshaping modern creative web design.</text>
      <text x="0" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#181816">02 / INTERVIEW: CURATING FOR 2026 AND BEYOND</text>
      <text x="0" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#757065">Conversation with leading creative directors on typography and emotion.</text>
    </g>
  </g>
</svg>