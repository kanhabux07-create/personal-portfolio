<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#1C1B1A" />
  
  <!-- Warm Bronze frame -->
  <rect x="30" y="30" width="540" height="740" fill="#242321" stroke="#3A3834" stroke-width="1" />
  
  <!-- Center Mockup: Box / Bottle / Stationery -->
  <g transform="translate(150, 140)">
    <!-- Shadow -->
    <ellipse cx="150" cy="400" rx="140" ry="25" fill="#0E0D0C" opacity="0.8" />
    <!-- Box Packaging -->
    <rect x="40" y="60" width="220" height="320" rx="4" fill="#EFE8DB" />
    <rect x="40" y="60" width="220" height="70" fill="#C85A32" />
    
    <!-- Label typography -->
    <text x="150" y="105" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FBF9F5" text-anchor="middle">ATELIER N° 09</text>
    <text x="150" y="170" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#141413" text-anchor="middle">BOTANICAL</text>
    <text x="150" y="195" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#5F5B53" text-anchor="middle">Extract &amp; Essence</text>
    <line x1="90" y1="215" x2="210" y2="215" stroke="#141413" stroke-width="1" opacity="0.2" />
    <text x="150" y="240" font-family="system-ui, sans-serif" font-size="9" fill="#7C786E" text-anchor="middle">FORMULATED IN COPENHAGEN</text>
    <text x="150" y="258" font-family="system-ui, sans-serif" font-size="9" fill="#7C786E" text-anchor="middle">100 ML // 3.4 FL. OZ.</text>
    
    <!-- Minimalist barcode graphic -->
    <g transform="translate(90, 310)">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#141413" stroke-width="2" />
      <line x1="6" y1="0" x2="6" y2="25" stroke="#141413" stroke-width="1" />
      <line x1="12" y1="0" x2="12" y2="25" stroke="#141413" stroke-width="3" />
      <line x1="22" y1="0" x2="22" y2="25" stroke="#141413" stroke-width="1" />
      <line x1="30" y1="0" x2="30" y2="25" stroke="#141413" stroke-width="2" />
      <line x1="42" y1="0" x2="42" y2="25" stroke="#141413" stroke-width="1" />
      <line x1="50" y1="0" x2="50" y2="25" stroke="#141413" stroke-width="3" />
      <line x1="65" y1="0" x2="65" y2="25" stroke="#141413" stroke-width="2" />
      <line x1="80" y1="0" x2="80" y2="25" stroke="#141413" stroke-width="1" />
      <line x1="95" y1="0" x2="95" y2="25" stroke="#141413" stroke-width="2" />
      <line x1="110" y1="0" x2="110" y2="25" stroke="#141413" stroke-width="3" />
    </g>
  </g>
  
  <text x="60" y="70" font-family="'Courier New', monospace" font-size="11" fill="#999388">IDENTITY &amp; PACKAGING // LUXURY GOODS</text>
  <text x="60" y="690" font-family="Georgia, serif" font-size="28" fill="#F4EFE6">Botanical Essence 2026</text>
  <text x="60" y="720" font-family="system-ui, sans-serif" font-size="12" fill="#8E887E">Eco-conscious packaging crafted with recycled cotton paper and soy ink.</text>
</svg>