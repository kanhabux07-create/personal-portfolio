<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <!-- Outer Browser Frame -->
  <rect width="900" height="580" rx="14" fill="#F5F1E8" stroke="#D8D0BF" stroke-width="1.5" />
  
  <!-- Browser Chrome Bar -->
  <rect width="900" height="46" rx="14" fill="#EAE3D4" />
  <circle cx="28" cy="23" r="6" fill="#141413" opacity="0.4" />
  <circle cx="48" cy="23" r="6" fill="#141413" opacity="0.4" />
  <circle cx="68" cy="23" r="6" fill="#141413" opacity="0.4" />
  
  <rect x="200" y="11" width="500" height="24" rx="12" fill="#DFD7C7" />
  <text x="450" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#5F5A4F" text-anchor="middle">editorial-narrative.press/stories/issue-08</text>

  <!-- Clean Editorial Web Content -->
  <g transform="translate(70, 75)">
    <!-- Header -->
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="11" fill="#C85A32">FEATURE STORY // CULTURE &amp; CODE</text>
    <text x="0" y="85" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#141413">The Elegance of the Single Page</text>
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="16" fill="#5F5B52">Why modern web aesthetics are turning away from clutter and embracing warm tactile calm.</text>
    
    <!-- Split Layout Content -->
    <g transform="translate(0, 150)">
      <!-- Left Column Text -->
      <g>
        <line x1="0" y1="0" x2="350" y2="0" stroke="#141413" stroke-width="1" opacity="0.15" />
        <text x="0" y="35" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#141413">"Whitespace is not empty space; it is the silence between musical notes that creates harmony."</text>
        <text x="0" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#504C44" width="350">
          In an era of hyper-stimulating interfaces, thoughtful restraint stands out. Subtle cream backgrounds soften the glare of back-lit screens, inviting longer contemplation.
        </text>
        
        <rect x="0" y="140" width="160" height="40" rx="20" fill="#141413" />
        <text x="80" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FBF9F5" text-anchor="middle">READ ARTICLE</text>
      </g>
      
      <!-- Right Column Visual Card -->
      <g transform="translate(420, 0)">
        <rect width="340" height="260" rx="10" fill="#E2DAC8" />
        <circle cx="170" cy="130" r="80" fill="#C85A32" opacity="0.85" />
        <rect x="70" y="60" width="200" height="140" fill="none" stroke="#141413" stroke-width="2" />
        <text x="170" y="135" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#FFF" text-anchor="middle">Atelier</text>
      </g>
    </g>
  </g>
</svg>