<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <!-- Outer Browser Frame -->
  <rect width="900" height="580" rx="14" fill="#0C1412" stroke="#1D2E29" stroke-width="1.5" />
  
  <!-- Browser Chrome Bar -->
  <rect width="900" height="46" rx="14" fill="#14211D" />
  <circle cx="28" cy="23" r="6" fill="#EF4444" />
  <circle cx="48" cy="23" r="6" fill="#F59E0B" />
  <circle cx="68" cy="23" r="6" fill="#10B981" />
  
  <rect x="200" y="11" width="500" height="24" rx="12" fill="#1D2F2A" />
  <text x="450" y="27" font-family="'Courier New', monospace" font-size="11" fill="#8FAFA3" text-anchor="middle">https://synth-audio.studio/generative</text>

  <!-- Interactive Generative Audio & Creative Web App -->
  <g transform="translate(60, 75)">
    <g transform="translate(0, 10)">
