<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DB" />
      <stop offset="100%" stop-color="#DFD6C3" />
    </linearGradient>
  </defs>
  <rect width="700" height="850" fill="url(#aboutGrad)" />
  
  <!-- Architectural grid -->
  <line x1="50" y1="50" x2="650" y2="50" stroke="#141413" stroke-opacity="0.1" stroke-width="1" />
  <line x1="50" y1="800" x2="650" y2="800" stroke="#141413" stroke-opacity="0.1" stroke-width="1" />
  <line x1="50" y1="50" x2="50" y2="800" stroke="#141413" stroke-opacity="0.1" stroke-width="1" />
  <line x1="650" y1="50" x2="650" y2="800" stroke="#141413" stroke-opacity="0.1" stroke-width="1" />

  <!-- Composition Elements -->
  <g transform="translate(100, 120)">
    <!-- Large Arch -->
    <path d="M 50 350 L 50 160 A 150 150 0 0 1 350 160 L 350 350 Z" fill="#20201D" />
    <path d="M 90 350 L 90 180 A 110 110 0 0 1 310 180 L 310 350 Z" fill="#C85A32" opacity="0.9" />
    <circle cx="200" cy="180" r="45" fill="#FBF9F5" />
    
    <!-- Abstract Pillar & Forms -->
    <rect x="370" y="200" width="40" height="150" fill="#141413" opacity="0.3" rx="4" />
    <rect x="420" y="240" width="30" height="110" fill="#141413" opacity="0.2" rx="4" />
    
    <!-- Typography Callout -->
    <text x="50" y="420" font-family="Georgia, serif" font-size="38" font-style="italic" fill="#141413" font-weight="bold">Design meets</text>
    <text x="50" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#141413" letter-spacing="-1">CODE &amp; FORM.</text>
    <text x="50" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#5F5B53" width="400">Crafting immersive digital narratives with clean architecture and refined visual balance.</text>
  </g>

  <!-- Footnote -->
  <text x="70" y="780" font-family="'Courier New', monospace" font-size="12" fill="#141413" opacity="0.6">STUDIO ARCHIVE // 2026</text>
  <text x="520" y="780" font-family="'Courier New', monospace" font-size="12" fill="#141413" opacity="0.6">EDITION NO. 01</text>
</svg>