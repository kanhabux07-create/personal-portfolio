<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1918" />
      <stop offset="100%" stop-color="#11100F" />
    </linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#p1bg)" rx="16" />
  
  <!-- Subtle Glow -->
  <circle cx="650" cy="150" r="180" fill="#C85A32" opacity="0.15" filter="blur(40px)" />
  
  <!-- Minimalist Web Interface Mockup Inside -->
  <g transform="translate(60, 50)">
    <!-- Browser/Card Frame -->
    <rect width="680" height="450" rx="12" fill="#242321" stroke="#383632" stroke-width="1" />
    <!-- Header bar -->
    <rect width="680" height="44" rx="12" fill="#1B1A19" />
    <circle cx="24" cy="22" r="5" fill="#EF4444" />
    <circle cx="42" cy="22" r="5" fill="#F59E0B" />
    <circle cx="60" cy="22" r="5" fill="#10B981" />
    <rect x="180" y="12" width="320" height="20" rx="10" fill="#2A2926" />
    <text x="340" y="26" font-family="system-ui, sans-serif" font-size="10" fill="#8E8B83" text-anchor="middle">luminary-atelier.store</text>
    
    <!-- Hero inside mockup -->
    <g transform="translate(40, 70)">
      <text x="0" y="35" font-family="Georgia, serif" font-size="28" fill="#FBF9F5" font-weight="bold">LUMINARY</text>
      <text x="0" y="55" font-family="'Courier New', monospace" font-size="10" fill="#C85A32">COLLECTION 2026 // HAUTE COUTURE</text>
      <text x="0" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#99958C">A bespoke digital storefront marrying luxury aesthetics with sub-second performance.</text>
      
      <!-- Mini product cards -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="180" height="220" rx="8" fill="#2F2D2A" />
        <rect x="15" y="15" width="150" height="130" rx="6" fill="#3D3A36" />
        <circle cx="90" cy="80" r="35" fill="#C85A32" opacity="0.8" />
        <text x="15" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FBF9F5">Sculptural Vase 01</text>
        <text x="15" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#A8A49C">\$ 480.00</text>
      </g>
      <g transform="translate(200, 120)">
        <rect x="0" y="0" width="180" height="220" rx="8" fill="#2F2D2A" />
        <rect x="15" y="15" width="150" height="130" rx="6" fill="#3D3A36" />
        <polygon points="90,45 130,115 50,115" fill="#E2825B" opacity="0.8" />
        <text x="15" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FBF9F5">Terracotta Object</text>
        <text x="15" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#A8A49C">\$ 320.00</text>
      </g>
      <g transform="translate(400, 120)">
        <rect x="0" y="0" width="180" height="220" rx="8" fill="#2F2D2A" />
        <rect x="15" y="15" width="150" height="130" rx="6" fill="#3D3A36" />
        <circle cx="90" cy="80" r="30" fill="#E5DEC9" opacity="0.7" />
        <text x="15" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FBF9F5">Ceramic Vessel</text>
        <text x="15" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#A8A49C">\$ 640.00</text>
      </g>
    </g>
  </g>
</svg>