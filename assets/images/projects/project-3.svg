<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2E2B" />
      <stop offset="100%" stop-color="#1B1C1A" />
    </linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#p3bg)" rx="16" />
  
  <g transform="translate(60, 50)">
    <rect width="680" height="450" rx="12" fill="#161715" stroke="#3E403B" stroke-width="1" />
    
    <!-- Header -->
    <rect width="680" height="44" rx="12" fill="#1F201D" />
    <circle cx="24" cy="22" r="5" fill="#EF4444" />
    <circle cx="42" cy="22" r="5" fill="#F59E0B" />
    <circle cx="60" cy="22" r="5" fill="#10B981" />
    <text x="340" y="26" font-family="'Courier New', monospace" font-size="11" fill="#7C8B7A" text-anchor="middle">kroma-ui.dev // TOKENS &amp; SYSTEM</text>

    <!-- Component preview grid -->
    <g transform="translate(40, 70)">
      <!-- Left tokens -->
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#F5F5F0">KROMA SYSTEM</text>
      <text x="0" y="40" font-family="'Courier New', monospace" font-size="11" fill="#889182">MULTI-BRAND DESIGN SYSTEM</text>
      
      <!-- Color Chips -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="45" height="45" rx="8" fill="#FBF9F5" />
        <rect x="55" y="0" width="45" height="45" rx="8" fill="#C85A32" />
        <rect x="110" y="0" width="45" height="45" rx="8" fill="#3B5349" />
        <rect x="165" y="0" width="45" height="45" rx="8" fill="#D4AF37" />
        <rect x="220" y="0" width="45" height="45" rx="8" fill="#1E201E" stroke="#444" />
      </g>
      
      <!-- Button showcase -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="120" height="36" rx="6" fill="#C85A32" />
        <text x="60" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFF" text-anchor="middle">Primary 01</text>
        
        <rect x="135" y="0" width="120" height="36" rx="6" fill="none" stroke="#686F64" stroke-width="1.5" />
        <text x="195" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E5E8E2" text-anchor="middle">Ghost Button</text>
      </g>
      
      <!-- Right Side Component Card -->
      <g transform="translate(320, 10)">
        <rect width="280" height="290" rx="10" fill="#20221E" stroke="#333730" stroke-width="1" />
        <text x="20" y="35" font-family="'Courier New', monospace" font-size="11" fill="#9BA395">COMPONENT PREVIEW</text>
        <rect x="20" y="55" width="240" height="48" rx="6" fill="#282B25" />
        <circle cx="45" cy="79" r="14" fill="#3B5349" />
        <rect x="70" y="72" width="120" height="8" rx="4" fill="#6B7365" />
        <rect x="70" y="86" width="70" height="6" rx="3" fill="#4B5246" />
        
        <!-- Toggle switch -->
        <g transform="translate(20, 125)">
          <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#D2D6CE">Dark Mode Sync</text>
          <rect x="190" y="2" width="45" height="22" rx="11" fill="#3B5349" />
          <circle cx="223" cy="13" r="8" fill="#FFF" />
        </g>
        
        <line x1="20" y1="170" x2="260" y2="170" stroke="#333730" />
        
        <!-- Stats Pill -->
        <rect x="20" y="195" width="240" height="65" rx="6" fill="#1A1C18" />
        <text x="35" y="222" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FBF9F5">99.8%</text>
        <text x="35" y="244" font-family="system-ui, sans-serif" font-size="10" fill="#7D8677">A11Y ACCESSIBILITY SCORE</text>
      </g>
    </g>
  </g>
</svg>